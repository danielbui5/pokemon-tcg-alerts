name: Update feed.json

on:
  schedule:
    - cron: "*/20 * * * *"   # every ~20 min (GitHub may delay under load)
  workflow_dispatch: {}       # allows manual "Run workflow" from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run scrapers
        working-directory: server
        run: node scrape.js

      - name: Commit updated feed.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add server/public/feed.json
          if git diff --cached --quiet; then
            echo "No changes to feed.json"
          else
            git commit -m "Update feed.json"
            git push
          fi
